name: Build Application JAR

# Define when the pipeline will trigger
on:
  push:
    branches: [ "main", "tests" ]
    tags:
      - '*'
    # paths:
    #   - "somesubdir/**"
  pull_request:
    types:
      - opened
  workflow_dispatch:

# Allows github to write to the releases location
permissions:
  contents: write

# The pipeline tasks
jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn test
      
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: ./target/*.jar